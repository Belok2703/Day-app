<!DOCTYPE html>
<html lang='ru'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'>
<meta name='apple-mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-status-bar-style' content='default'>
<meta name='apple-mobile-web-app-title' content='День'>
<meta name='theme-color' content='#f3ede2'>
<title>День</title>
<style>
:root{--cream:#f3ede2;--card:#fbf8f2;--ink:#141414;--mute:#8d867a;--line:#e4dccd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 40px);max-width:560px;margin-inline:auto}
h1{font-family:ui-serif,Georgia,serif;font-weight:500;font-size:40px;letter-spacing:-1px;margin:18px 0 2px}
.date{color:var(--mute);margin-bottom:18px;text-transform:capitalize}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
.rise{opacity:0;animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards}
.card{background:var(--card);border-radius:26px;padding:6px 14px;margin-bottom:14px;box-shadow:0 6px 24px rgba(20,20,20,.06)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.task{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);transition:opacity .25s,transform .25s,background .2s;animation:rise .4s both}
.task:last-child{border-bottom:none}
.task.out{opacity:0;transform:translateX(40px)}
.task.drag{background:var(--cream);transform:scale(1.02);box-shadow:0 8px 24px rgba(0,0,0,.15);border-radius:14px;position:relative;z-index:2}
.handle{touch-action:none;color:var(--mute);padding:6px 4px;font-size:18px;letter-spacing:-3px;user-select:none;cursor:grab}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);background:transparent;padding:0;flex:none;position:relative;transition:background .25s}
.chk.on{background:var(--ink);animation:pop .35s}
.chk.on::after{content:'';position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid var(--cream);border-width:0 2px 2px 0;transform:rotate(45deg)}
input{font:inherit;color:var(--ink);background:transparent;border:none;outline:none;min-width:0}
.time{width:76px;color:var(--mute);font-variant-numeric:tabular-nums;flex:none}
.name{flex:1;font-size:17px;transition:color .3s}
.done .name{color:var(--mute);text-decoration:line-through}
.del{background:none;border:none;color:var(--mute);font-size:22px;padding:2px 6px}
.add{display:flex;gap:8px;margin-bottom:22px}
.pill{background:var(--card);border-radius:20px;padding:13px 16px;box-shadow:0 4px 14px rgba(20,20,20,.05)}
.add .pill.t{flex:1}
.btn{background:var(--ink);color:var(--cream);border:none;border-radius:20px;padding:13px 18px;font:inherit;font-weight:600;transition:transform .15s}
.btn:active{transform:scale(.94)}
.money{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.box{background:var(--card);border-radius:26px;padding:16px;box-shadow:0 6px 24px rgba(20,20,20,.06)}
.box.dark{background:var(--ink);color:var(--cream)}
.label{color:var(--mute);font-size:13px}
.sum{font-family:ui-serif,Georgia,serif;font-size:28px;margin:4px 0 10px}
.box input{width:100%;background:var(--cream);border-radius:14px;padding:11px;margin-bottom:8px}
.box.dark input{background:#2a2a2a;color:var(--cream)}
.box .btn{width:100%}
.box.dark .btn{background:var(--cream);color:var(--ink)}
.total{background:var(--card);border-radius:26px;padding:20px;text-align:center;box-shadow:0 6px 24px rgba(20,20,20,.06)}
.total .sum{font-size:48px;margin:2px 0}
.hist{margin-top:14px}
.hrow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);animation:rise .4s both}
.hrow .d{color:var(--mute);font-size:12px;width:52px;flex:none}
.hrow .l{flex:1}
.hrow .v{width:90px;text-align:right}
.hrow.earn .v{font-weight:600}
.reset{color:var(--mute);font-size:13px;text-align:center;margin-top:26px}
</style>
</head>
<body>
<h1 class='rise'>Мой день</h1>
<div class='date rise' id='date' style='animation-delay:.05s'></div>
<div class='bar rise' style='animation-delay:.1s'><i id='prog'></i></div>
<div class='card rise' id='tasks' style='animation-delay:.15s'></div>
<div class='add rise' style='animation-delay:.2s'>
<input class='pill' type='time' id='newTime' value='12:00' style='width:110px'>
<input class='pill t' type='text' id='newName' placeholder='Новое дело'>
<button class='btn' onclick='addTask()'>+</button>
</div>
<div class='money rise' style='animation-delay:.25s'>
<div class='box'><div class='label'>Заработано</div><div class='sum' id='earnSum'>0</div>
<input type='text' id='earnL' placeholder='За что'><input type='number' id='earnIn' placeholder='Сумма' inputmode='decimal'>
<button class='btn' onclick="addMoney('earn')">Добавить</button></div>
<div class='box dark'><div class='label'>Потрачено</div><div class='sum' id='spendSum'>0</div>
<input type='text' id='spendL' placeholder='На что'><input type='number' id='spendIn' placeholder='Сумма' inputmode='decimal'>
<button class='btn' onclick="addMoney('spend')">Добавить</button></div>
</div>
<div class='total rise' style='animation-delay:.3s'><div class='label'>Всего денег</div><div class='sum' id='total'>0</div></div>
<div class='card hist' id='hist'></div>
<div class='reset' onclick='resetChecks()'>Сбросить галочки на новый день</div>
<script>
const KEY='day-v2';
const uid=()=>Math.random().toString(36).slice(2,9);
const def={tasks:[['07:00','Встать'],['08:00','Поесть'],['09:00','Сходить на работу'],['18:00','Сходить в зал'],['20:00','Поиграть'],['22:00','Отдохнуть']].map(a=>({id:uid(),t:a[0],n:a[1],d:false})),money:[]};
let S=JSON.parse(localStorage.getItem(KEY)||'null')||def;
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const fmt=n=>n.toLocaleString('ru-RU',{maximumFractionDigits:2});
function el(tag,props){const e=document.createElement(tag);Object.assign(e,props||{});return e}
function countTo(node,to){const from=parseFloat(node.dataset.v||0);node.dataset.v=to;const t0=performance.now();(function step(t){const p=Math.min((t-t0)/500,1);node.textContent=fmt(from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)})(t0)}
function progress(){const d=S.tasks.filter(x=>x.d).length;document.getElementById('prog').style.width=(S.tasks.length?d/S.tasks.length*100:0)+'%'}
function renderTasks(){
const box=document.getElementById('tasks');box.innerHTML='';
S.tasks.forEach((t,i)=>{
const row=el('div',{className:'task'+(t.d?' done':'')});row.dataset.id=t.id;row.style.animationDelay=(i*0.04)+'s';
const handle=el('div',{className:'handle',textContent:'⋮⋮'});
const chk=el('button',{className:'chk'+(t.d?' on':'')});
chk.onclick=()=>{t.d=!t.d;save();chk.classList.toggle('on',t.d);row.classList.toggle('done',t.d);progress()};
const time=el('input',{type:'time',value:t.t,className:'time'});time.oninput=()=>{t.t=time.value;save()};
const name=el('input',{type:'text',value:t.n,className:'name'});name.oninput=()=>{t.n=name.value;save()};
const del=el('button',{className:'del',textContent:'×'});
del.onclick=()=>{row.classList.add('out');setTimeout(()=>{S.tasks=S.tasks.filter(x=>x.id!==t.id);save();renderTasks()},250)};
handle.onpointerdown=e=>{e.preventDefault();handle.setPointerCapture(e.pointerId);row.classList.add('drag')};
handle.onpointermove=e=>{if(!row.classList.contains('drag'))return;
for(const r of [...box.children]){if(r===row)continue;const b=r.getBoundingClientRect();
if(e.clientY>b.top&&e.clientY<b.bottom){box.insertBefore(row,e.clientY<b.top+b.height/2?r:r.nextSibling);break}}};
const end=()=>{if(!row.classList.contains('drag'))return;row.classList.remove('drag');
const order=[...box.children].map(r=>r.dataset.id);S.tasks.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));save()};
handle.onpointerup=end;handle.onpointercancel=end;
row.append(handle,chk,time,name,del);box.append(row)});
progress()}
function renderMoney(){
const sum=k=>S.money.filter(m=>m.k===k).reduce((s,m)=>s+m.v,0);
const e=sum('earn'),s=sum('spend');
countTo(document.getElementById('earnSum'),e);countTo(document.getElementById('spendSum'),s);countTo(document.getElementById('total'),e-s);
const h=document.getElementById('hist');h.innerHTML='';
S.money.slice().reverse().forEach(m=>{
const row=el('div',{className:'hrow '+m.k});
const d=el('div',{className:'d',textContent:m.date});
const l=el('input',{type:'text',value:m.l||'',placeholder:m.k==='earn'?'доход':'расход',className:'l'});l.oninput=()=>{m.l=l.value;save()};
const v=el('input',{type:'number',value:m.v,className:'v',inputMode:'decimal'});
v.onchange=()=>{const n=parseFloat(v.value);if(n>0){m.v=n;save();renderMoney()}else v.value=m.v};
const sign=el('div',{textContent:m.k==='earn'?'+':'−'});
const del=el('button',{className:'del',textContent:'×'});
del.onclick=()=>{S.money=S.money.filter(x=>x.id!==m.id);save();renderMoney()};
row.append(d,l,sign,v,del);h.append(row)})}
function addTask(){const n=document.getElementById('newName').value.trim();const t=document.getElementById('newTime').value||'12:00';if(!n)return;
S.tasks.push({id:uid(),t,n,d:false});document.getElementById('newName').value='';save();renderTasks()}
function addMoney(k){const a=document.getElementById(k+'In'),l=document.getElementById(k+'L');
const v=parseFloat(a.value.replace(',','.'));if(!v||v<=0)return;
S.money.push({id:uid(),k,v,l:l.value.trim(),date:new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'short'})});
a.value='';l.value='';save();renderMoney()}
function resetChecks(){if(confirm('Снять все галочки?')){S.tasks.forEach(x=>x.d=false);save();renderTasks()}}
document.getElementById('date').textContent=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
renderTasks();renderMoney();
</script>
</body>
</html>
